services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: furkan123
      MYSQL_DATABASE: mini_trello
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-u", "root", "-pfurkan123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: mini_trello
      DB_USER: root
      DB_PASSWORD: furkan123
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: